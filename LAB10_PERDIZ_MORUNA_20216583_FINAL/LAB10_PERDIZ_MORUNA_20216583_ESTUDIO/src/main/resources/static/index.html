<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perdiz Moruna - Semillas de Girasol</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="contenedor-principal">

    <h1>EL JUEGO DE LA PERDIZ MORUNA Y LAS SEMILLAS DE GIRASOL</h1>

    <div class="juego">

        <div id="tablero" class="tablero"></div>

        <div class="panel">

            <label for="dimensiones">Dimensiones del kernel:</label>
            <input type="text"
                   id="dimensiones"
                   value="2x2"
                   autocomplete="off">

            <div id="mensaje" class="mensaje"></div>

            <p class="subtitulo">Arrastra las semillas</p>

            <div id="kernel"
                 class="kernel"
                 draggable="true"></div>

            <div class="botones">
                <button type="button" id="btnReiniciar">
                    Reiniciar
                </button>

                <button type="button" id="btnPausar">
                    Pausar
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
<script src="/js/juego.js"></script>

</body>
</html>
